# Capture the trackers before the rolling export drops them.
#
# The Asana -> Sheets sync keeps roughly the last 500 tasks. Once a month's rows
# fall out of that window the scorecard cannot tell "nobody filed" from "the
# entries aged out", so it reports a month of missed days that were never
# missed. scripts/archive.js copies every entry into archive/<tracker>/<month>.json
# while it is still in the window; the dashboard reads those files back and uses
# them for any date the live sheet no longer reaches.
#
# Every 15 minutes, not daily: the window is measured in rows, not in time, and
# a once-a-day run only ever sees whatever survived the other 23 hours and 59
# minutes of everyone else's filing in between. That is exactly how four days
# of one person's early-July entries were gone before this workflow had run on
# any schedule at all — filed on time, but aged out of the shared 500-row
# window weeks before the first run ever got a chance to see them. GitHub will
# not run a schedule more often than every 5 minutes regardless of what the
# cron here says; 15 gives a safety margin on top of that floor without
# hammering Google's export endpoint on every tick.
name: Archive tracker entries

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:      # and on demand, for the first backfill

# The job's whole purpose is to commit what it found.
permissions:
  contents: write

concurrency:
  # Two runs writing the same month would race on the same files. Queue instead.
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install — the script uses only Node builtins and the
      # page's own parser, lifted out of index.html at run time.
      - name: Capture new entries
        env:
          # Only needed if the sheets are ever repointed; the script falls back to
          # the same defaults api/data.js carries.
          SHEET_ID: ${{ vars.SHEET_ID }}
          CLIENT_SHEET_ID: ${{ vars.CLIENT_SHEET_ID }}
        run: node scripts/archive.js

      - name: Commit anything new
        run: |
          if [ -z "$(git status --porcelain archive)" ]; then
            echo "Nothing new to archive."
            exit 0
          fi
          git config user.name  "kpi-archiver"
          git config user.email "actions@github.com"
          git add archive
          # Timestamped to the minute, not just the day — up to 96 runs a day can
          # now each produce a commit, and a bare date would make them indistinguishable.
          git commit -m "Archive tracker entries ($(date -u +%Y-%m-%dT%H:%M)Z)"
          git push
